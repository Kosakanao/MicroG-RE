name: "Gradle build"
permissions: {}
# Manual runs only. The owner triggers this from the Actions page and picks
# the branch to build - no automatic runs on push or pull_request.
on:
  - workflow_dispatch

jobs:
  build:
    name: "Build arm64 debug APK"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Setup Java"
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      # One flavor (default), one build type (debug), one ABI (arm64-v8a).
      # Without -Pabi the build bundles four ABIs and every flavor, which is
      # why the previous artifact was ~343 MB instead of ~43 MB.
      - name: "Build single-ABI arm64 debug APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultDebug -Pabi=arm64-v8a"

      - name: "List built APKs"
        run: |
          find play-services-core/build/outputs/apk -name "*.apk" -printf "%p  %s bytes\n"

      - name: "Upload APK artifact"
        uses: actions/upload-artifact@v7
        with:
          name: microg-default-debug-arm64-v8a
          path: "play-services-core/build/outputs/apk/default/debug/*.apk"
          if-no-files-found: error
